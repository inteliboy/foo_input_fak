[package]
name = "fak_capi"
version = "1.1.3"
edition = "2021"
description = "C ABI over the FAK decoder/metadata library, for the foobar2000 component (foo_input_fak)"

[lib]
crate-type = ["staticlib"]
path = "src/lib.rs"

[dependencies]
fak = { git = "https://github.com/inteliboy/FAK-Codec", rev = "f30902c7ab23803a9354a45e3249cdb26ae01bf9", default-features = false }
mimalloc = { version = "0.1", default-features = false }
libmimalloc-sys = { version = "0.1", default-features = false, features = ["extended"] }

[profile.release]
opt-level = 3
panic = "unwind"
